<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Your Learning Roadmap</title>

  <!-- icons -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <!-- Mermaid 10.7 -->
  <script type="module"
          src="https://cdn.jsdelivr.net/npm/mermaid@10.7.0/dist/mermaid.esm.min.mjs"></script>

  <style>
    :root{
      --primary:#3a86ff;--secondary:#8338ec;--accent:#ff006e;
      --light:#fff;--gray:#f8f9fa;--text:#333;
      --n1:#fef08a;--n2:#93c5fd;--n3:#a5b4fc;--n4:#fdba74;--n5:#f9a8d4;
    }
    *{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;}
    body{background:linear-gradient(135deg,var(--gray)0%,#e9ecef 100%);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}

    /* shell */
    .roadmap-container{max-width:1200px;width:95%;margin:2rem auto;background:var(--light);
      border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.1);display:flex;flex-direction:column;}

    /* header */
    .roadmap-header{background:linear-gradient(90deg,var(--primary),var(--secondary));
      color:#fff;padding:1.5rem 2rem;display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;}
    .roadmap-title{font-size:1.8rem;font-weight:700;}
    .roadmap-controls{display:flex;gap:.5rem;margin-top:.5rem;}
    .roadmap-btn{background:rgba(255,255,255,.25);border:none;color:#fff;width:36px;height:36px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;}
    .roadmap-btn:hover{background:rgba(255,255,255,.35);transform:scale(1.05);}

    /* info bar */
    .roadmap-info{background:rgba(58,134,255,.1);padding:1rem 2rem;display:flex;flex-wrap:wrap;
      gap:1rem;justify-content:space-between;font-size:.95rem;}
    .info-item{display:flex;align-items:center;gap:.5rem;} .info-item i{color:var(--primary);}
    .info-label{font-weight:600;opacity:.7;}

    /* legend */
    .roadmap-legend{display:flex;flex-wrap:wrap;gap:1rem;padding:.5rem 2rem;border-bottom:1px solid #eee;background:#fafafa;
      font-size:.85rem;} .legend-color{width:18px;height:18px;border-radius:4px;border:1px solid rgba(0,0,0,.1);}

    /* content viewport */
    .roadmap-content{position:relative;flex:1;overflow:hidden;}
    .viewport{width:100%;height:100%;overflow:auto;position:relative;background:#fff;}
    .roadmap-diagram svg{user-select:none;border-radius:8px;}

    /* zoom buttons */
    .zoom-controls{position:absolute;bottom:1.5rem;right:1.5rem;display:flex;flex-direction:column;gap:.5rem;z-index:10;}
    .zoom-btn{background:#fff;border:1px solid #ddd;border-radius:50%;width:36px;height:36px;
      display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;
      box-shadow:0 2px 5px rgba(0,0,0,.1);transition:.2s;}
    .zoom-btn:hover{background:var(--primary);color:#fff;transform:scale(1.05);}

    /* footer */
    .roadmap-footer{padding:1rem 2rem;background:#f9f9f9;border-top:1px solid #eee;
      display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.75rem;font-size:.85rem;}
    .share-btn{background:#fff;border:1px solid #ddd;padding:.4rem .8rem;border-radius:20px;cursor:pointer;
      display:flex;align-items:center;gap:.3rem;transition:.2s;font-size:.85rem;}
    .share-btn:hover{background:#f0f0f0;}
    .download-btn{background:var(--primary);color:#fff;border-color:var(--primary);} .download-btn:hover{background:var(--secondary);}

    /* loader */
    .loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:1rem;background:rgba(255,255,255,.95);z-index:100;pointer-events:none;}
    .spinner{width:50px;height:50px;border:4px solid rgba(0,0,0,.1);border-radius:50%;
      border-top-color:var(--primary);animation:spin 1s linear infinite;} @keyframes spin{to{transform:rotate(360deg);}}
    .error{color:#b91c1c;font-weight:600;text-align:center;}

    /* theme toggle */
    .theme-toggle{position:fixed;top:1rem;right:1rem;width:40px;height:40px;border:none;border-radius:50%;
      background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;
      box-shadow:0 4px 20px rgba(0,0,0,.1);z-index:1000;}
    .theme-toggle:hover{background:var(--secondary);}

    /* dark mode */
    .dark-mode{--primary:#3b82f6;--secondary:#8b5cf6;--accent:#ec4899;--light:#1e293b;--gray:#0f172a;--text:#f1f5f9;
      background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);}
    .dark-mode .roadmap-container{background:#1e293b;}
    .dark-mode .roadmap-legend,.dark-mode .roadmap-footer{background:#0f172a;border-color:#2d3748;}
    .dark-mode .roadmap-info{background:rgba(59,130,246,.1);}
    .dark-mode .zoom-btn,.dark-mode .share-btn{background:#2d3748;border-color:#4a5568;color:#f1f5f9;}
    .dark-mode .zoom-btn:hover{background:var(--primary);} .dark-mode .share-btn:hover{background:#4a5568;}
  </style>
</head>

<body>
<button class="theme-toggle" id="theme"><i class="fas fa-moon"></i></button>

<div class="roadmap-container">
  <div class="roadmap-header">
    <h1 class="roadmap-title">Your Learning Roadmap</h1>
    <div class="roadmap-controls">
      <button class="roadmap-btn" id="dirBtn" title="Toggle LR / TB"><i class="fas fa-arrows-alt-h"></i></button>
      <button class="roadmap-btn" id="fullBtn" title="Fullscreen"><i class="fas fa-expand"></i></button>
    </div>
  </div>

  <div class="roadmap-info">
    <div class="info-item"><i class="fas fa-bullseye"></i><span class="info-label">Goal:</span><span id="goal-val">‑</span></div>
    <div class="info-item"><i class="fas fa-chart-line"></i><span class="info-label">Level:</span><span id="level-val">‑</span></div>
    <div class="info-item"><i class="fas fa-clock"></i><span class="info-label">Time:</span><span id="time-val">‑</span></div>
    <div class="info-item"><i class="fas fa-list"></i><span class="info-label">Purpose:</span><span id="purpose-val">‑</span></div>
  </div>

  <div class="roadmap-legend">
    <div class="legend-color" style="background:var(--n1)"></div>Foundational
    <div class="legend-color" style="background:var(--n2)"></div>Core
    <div class="legend-color" style="background:var(--n3)"></div>Skill‑build
    <div class="legend-color" style="background:var(--n4)"></div>Practice
    <div class="legend-color" style="background:var(--n5)"></div>Advanced
  </div>

  <div class="roadmap-content">
    <div class="loading" id="loader"><div class="spinner"></div><p>Rendering…</p></div>
    <div class="viewport"><div id="diagram"></div></div>

    <div class="zoom-controls">
      <button class="zoom-btn" id="zin"><i class="fas fa-plus"></i></button>
      <button class="zoom-btn" id="zout"><i class="fas fa-minus"></i></button>
      <button class="zoom-btn" id="reset"><i class="fas fa-sync-alt"></i></button>
    </div>
  </div>

  <div class="roadmap-footer">
    <span>Generated from your learning profile</span>
    <div>
      <button class="share-btn" id="copy"><i class="fas fa-link"></i>Copy Link</button>
      <button class="share-btn download-btn" id="dl"><i class="fas fa-download"></i>Download</button>
    </div>
  </div>
</div>

<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10.7.0/dist/mermaid.esm.min.mjs';
mermaid.initialize({startOnLoad:false,securityLevel:'loose',theme:'default',
  flowchart:{nodeSpacing:60,rankSpacing:80,curve:'basis',useMaxWidth:false}});

const qs=new URLSearchParams(location.search);
['goal','level','time','purpose'].forEach(k=>{
  document.getElementById(`${k}-val`).textContent=qs.get(k)||'‑';
});

let dir=qs.get('dir')==='TB'?'TB':'LR';   // default horizontal
document.getElementById('dirBtn').innerHTML=
  dir==='LR'?'<i class="fas fa-arrows-alt-v"></i>':'<i class="fas fa-arrows-alt-h"></i>';

document.getElementById('dirBtn').onclick=()=>{
  dir=dir==='LR'?'TB':'LR';
  document.getElementById('dirBtn').innerHTML=
    dir==='LR'?'<i class="fas fa-arrows-alt-v"></i>':'<i class="fas fa-arrows-alt-h"></i>';
  render();
};

document.getElementById('fullBtn').onclick=()=>{
  const c=document.querySelector('.roadmap-container');
  if(!document.fullscreenElement){c.requestFullscreen();document.getElementById('fullBtn').innerHTML='<i class="fas fa-compress"></i>';}
  else{document.exitFullscreen();document.getElementById('fullBtn').innerHTML='<i class="fas fa-expand"></i>';}
};

document.getElementById('theme').onclick=()=>{
  document.body.classList.toggle('dark-mode');
  document.getElementById('theme').innerHTML=
    document.body.classList.contains('dark-mode')?'<i class="fas fa-sun"></i>':'<i class="fas fa-moon"></i>';
};

async function render(){
  document.getElementById('loader').style.display='flex';
const raw = qs.get('roadmap') || '';

let text;                       // ← use this everywhere below
try {
  text = decodeURIComponent(raw);   // works if it was encoded
} catch {
  text = raw;                       // already plain text – leave it be
  console.warn('Roadmap string is not URI‑encoded, using it as‑is.');
}

/* strip ``` fences and any existing “graph LR/TB …” header */
let code = text
  .replace(/^```mermaid\s*/i, '')
  .replace(/\s*```$/i, '')
  .replace(/^graph\s+(LR|TB)?[^\n\r]*[\n\r]+/i, '')
  .trim();

/* prepend our header only once */
if (!code.toLowerCase().startsWith('graph')) {
  code = `graph ${dir}\n` + code;
}
  code+=`
classDef start    fill:#fef08a,stroke:#eab308,stroke-width:2px;
classDef core     fill:#93c5fd,stroke:#2563eb,stroke-width:2px;
classDef skill    fill:#a5b4fc,stroke:#4f46e5,stroke-width:2px;
classDef practice fill:#fdba74,stroke:#ea580c,stroke-width:2px;
classDef advanced fill:#f9a8d4,stroke:#a21caf,stroke-width:2px;
linkStyle default stroke:#64748b,stroke-width:2px;`;

  const holder=document.getElementById('diagram');
  holder.innerHTML=`<div class="mermaid">${code}</div>`;

  try{await mermaid.run({nodes:[holder.querySelector('.mermaid')]});}
  catch(e){fail(e.str||e.message);return;}

  await new Promise(r=>requestAnimationFrame(r));
  fit(); wirePanZoom();
  document.getElementById('loader').style.display='none';
}
render();

/* fit SVG to viewport */
function fit(){
  const svg=document.querySelector('#diagram svg'); if(!svg)return;
  const vp=document.querySelector('.viewport');
  const bb=svg.getBBox();
  const pad=40;
  const scale=Math.min((vp.clientWidth-pad)/bb.width,(vp.clientHeight-pad)/bb.height,1);
  svg.style.transformOrigin='0 0';
  svg.style.transform=`translate(${pad/2}px,${pad/2}px) scale(${scale})`;
  vp.scrollLeft=0; vp.scrollTop=0;
}

/* pan + wheel zoom */
function wirePanZoom(){
  const svg=document.querySelector('#diagram svg'); if(!svg)return;
  const vp=document.querySelector('.viewport');
  let scale=1,panX=0,panY=0,startX,startY,drag=false;
  const apply=()=>{svg.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;};

  vp.onwheel=e=>{
    e.preventDefault();
    const delta=Math.sign(e.deltaY);
    scale=Math.max(.2,Math.min(4,scale*(delta>0?0.9:1.1))); apply();
  };
  const get=e=>e.touches?e.touches[0]:e;
  const down=e=>{drag=true;const p=get(e);startX=p.clientX-panX;startY=p.clientY-panY;};
  const move=e=>{if(!drag)return;const p=get(e);panX=p.clientX-startX;panY=p.clientY-startY;apply();};
  const up=()=>drag=false;
  svg.addEventListener('mousedown',down); window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  svg.addEventListener('touchstart',down,{passive:true}); svg.addEventListener('touchmove',move,{passive:true}); svg.addEventListener('touchend',up);
  document.getElementById('zin').onclick=()=>{scale=Math.min(4,scale*1.2);apply();};
  document.getElementById('zout').onclick=()=>{scale=Math.max(.2,scale/1.2);apply();};
  document.getElementById('reset').onclick=()=>{scale=1;panX=panY=0;apply();};
}

document.getElementById('copy').onclick=()=>{
  navigator.clipboard.writeText(location.href).then(()=>{
    const b=document.getElementById('copy'); const txt=b.innerHTML;
    b.innerHTML='<i class="fas fa-check"></i> Copied!'; setTimeout(()=>b.innerHTML=txt,2000);
  });
};
document.getElementById('dl').onclick=()=>{
  const svg=document.querySelector('#diagram svg'); if(!svg)return;
  const blob=new Blob([svg.outerHTML],{type:'image/svg+xml'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`${(qs.get('goal')||'roadmap').replace(/\\s+/g,'_')}.svg`;
  a.click(); URL.revokeObjectURL(a.href);
};

function fail(msg){
  document.getElementById('loader').innerHTML=`<p class="error">${msg}</p>`;
}
</script></body></html>
